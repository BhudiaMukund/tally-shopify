# Local development stack: Mongo, Valkey and Garage.
#
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm db:indexes
#   pnpm garage:setup
#
# The app itself is not in here — it runs on the host with `pnpm dev`, which is
# what the hostnames below assume. Production is five Coolify resources, and
# gets real credentials; nothing here is a secret, and nothing here should be
# reachable from outside your machine.
name: tally-dev

services:
  # Standalone, to match the Coolify deploy. Nothing in Tally uses a
  # transaction or a change stream — every write touches one document — and a
  # local replica set would mean the first code that reached for one passed
  # here and failed only after deploy.
  #
  # No `--auth`: the port is bound to your own machine and there is nothing in
  # here worth protecting. Production gets credentials.
  mongo:
    image: mongo:8
    command: ["--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    # Appendonly so a restart doesn't drop queued enrichment jobs.
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The S3-compatible store presigned uploads go to (commit 9). Spiked against
  # MinIO first: PutBucketCors is implemented and a real cross-origin browser
  # PUT against a presigned URL works, so it stands in directly.
  #
  # No init container here the way minio-init used to run `mc` commands —
  # Garage's CLI has no equivalent of `mc anonymous set` or a one-line bucket
  # setup, and CORS specifically is an S3-API-only operation (no CLI command
  # exists for it at all). `pnpm garage:setup` does all of it — layout, bucket,
  # key, CORS — from the host, using the same `@aws-sdk/client-s3` this app
  # uses for real, so the setup path exercises the real client rather than a
  # separate tool's idea of the same operation.
  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./garage.dev.toml:/etc/garage.toml
      - garage-data:/data
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # inter-node RPC (unused at replication_factor 1, exposed for parity with prod)
      - "3902:3902" # web (unused — nothing here serves images as a static site)
      - "3903:3903" # admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
  valkey-data:
  garage-data:
